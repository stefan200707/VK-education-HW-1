<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="560" viewBox="0 0 1260 560" font-family="Arial, sans-serif">
<rect width="1260" height="560" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<!-- Screen 1 -->
<g transform="translate(20,40)">
<text x="110" y="-15" text-anchor="middle" font-size="15" font-weight="bold">1. Главный экран (мама)</text>
<rect width="220" height="440" rx="24" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="110" y="50" text-anchor="middle" font-size="18">Внук на связи</text>
<text x="110" y="100" text-anchor="middle" font-size="14" fill="#555">Что случилось с телефоном?</text>
<circle cx="110" cy="220" r="75" fill="#e53935"/>
<text x="110" y="212" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">ПОМОГИТЕ</text>
<text x="110" y="238" text-anchor="middle" font-size="13" fill="#fff">нажмите и говорите</text>
<rect x="20" y="340" width="180" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="110" y="365" text-anchor="middle" font-size="13">Кто подключён: никто</text>
</g>
<!-- Screen 2 -->
<g transform="translate(265,40)">
<text x="110" y="-15" text-anchor="middle" font-size="15" font-weight="bold">2. ИИ слушает и чинит</text>
<rect width="220" height="440" rx="24" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<rect x="20" y="40" width="180" height="50" rx="10" fill="#fff" stroke="#999"/>
<text x="30" y="62" font-size="12">Мама: «Пропал звук,</text>
<text x="30" y="80" font-size="12">не слышу звонки»</text>
<rect x="20" y="110" width="180" height="70" rx="10" fill="#e3f2fd" stroke="#64b5f6"/>
<text x="30" y="132" font-size="12">ИИ: Был включён режим</text>
<text x="30" y="150" font-size="12">«Не беспокоить». Выключаю</text>
<text x="30" y="168" font-size="12">и прибавляю громкость…</text>
<rect x="20" y="300" width="180" height="60" rx="10" fill="#c8e6c9"/>
<text x="110" y="335" text-anchor="middle" font-size="16" font-weight="bold">✓ Готово!</text>
<text x="110" y="400" text-anchor="middle" font-size="12" fill="#555">Если не помогло — скажите</text>
</g>
<!-- Screen 3 -->
<g transform="translate(510,40)">
<text x="110" y="-15" text-anchor="middle" font-size="15" font-weight="bold">3. Подтверждение удаления</text>
<rect width="220" height="440" rx="24" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="110" y="70" text-anchor="middle" font-size="14">Мало памяти.</text>
<text x="110" y="100" text-anchor="middle" font-size="14">Удалить мусор: 2,1 ГБ?</text>
<text x="110" y="130" text-anchor="middle" font-size="12" fill="#555">Фото и видео не трогаю</text>
<rect x="20" y="220" width="180" height="60" rx="10" fill="#43a047"/>
<text x="110" y="257" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">ДА</text>
<rect x="20" y="300" width="180" height="60" rx="10" fill="#9e9e9e"/>
<text x="110" y="337" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">НЕТ</text>
</g>
<!-- Screen 4 -->
<g transform="translate(755,40)">
<text x="110" y="-15" text-anchor="middle" font-size="15" font-weight="bold">4. ИИ не справился (мама)</text>
<rect width="220" height="440" rx="24" fill="#fff8e1" stroke="#333" stroke-width="2"/>
<text x="110" y="120" text-anchor="middle" font-size="15">Не получилось починить</text>
<text x="110" y="150" text-anchor="middle" font-size="15">самому.</text>
<text x="110" y="200" text-anchor="middle" font-size="15" font-weight="bold">Зову Стефана…</text>
<circle cx="110" cy="270" r="30" fill="none" stroke="#fb8c00" stroke-width="4" stroke-dasharray="20 10"/>
<rect x="20" y="360" width="180" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="110" y="385" text-anchor="middle" font-size="13">Отменить</text>
</g>
<!-- Screen 5 -->
<g transform="translate(1000,40)">
<text x="120" y="-15" text-anchor="middle" font-size="15" font-weight="bold">5. Родственник подключается</text>
<rect width="240" height="440" rx="24" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<rect x="15" y="30" width="210" height="90" rx="10" fill="#fff" stroke="#fb8c00"/>
<text x="25" y="55" font-size="12" font-weight="bold">🔔 Маме нужна помощь</text>
<text x="25" y="77" font-size="11">«Не открывается Госуслуги»</text>
<text x="25" y="97" font-size="11" fill="#555">ИИ пробовал: 2 действия</text>
<rect x="15" y="140" width="210" height="200" rx="6" fill="#ddd" stroke="#999"/>
<text x="120" y="245" text-anchor="middle" font-size="12" fill="#555">экран маминого телефона</text>
<rect x="15" y="355" width="100" height="40" rx="8" fill="#1e88e5"/>
<text x="65" y="380" text-anchor="middle" font-size="12" fill="#fff">Подключиться</text>
<rect x="125" y="355" width="100" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="175" y="380" text-anchor="middle" font-size="12">🎤 Голос</text>
</g>
<!-- arrows -->
<line x1="242" y1="260" x2="263" y2="260" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="487" y1="260" x2="508" y2="260" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="732" y1="260" x2="753" y2="260" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="977" y1="260" x2="998" y2="260" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="630" y="540" text-anchor="middle" font-size="13" fill="#555">Успех: 1 → 2 (или 1 → 3 → 2).  Отказ: 1 → 4 → 5 (ИИ не справился, подключается родственник)</text>
</svg>
