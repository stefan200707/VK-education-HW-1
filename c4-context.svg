<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, sans-serif"><rect width="1000" height="560" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#555"/></marker></defs><text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold">C4 уровень 1 — контекст системы «Внук на связи»</text><rect x="40" y="60" width="260" height="80" rx="10" fill="#08427b" stroke="#333"/><text x="170.0" y="86.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Пожилой пользователь</text><text x="170.0" y="104.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">[человек]</text><text x="170.0" y="122.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">жалуется голосом, подтверждает действия</text><rect x="370" y="60" width="260" height="80" rx="10" fill="#08427b" stroke="#333"/><text x="500.0" y="86.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Родственник</text><text x="500.0" y="104.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">[человек]</text><text x="500.0" y="122.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">подключает телефон, платит, помогает</text><rect x="700" y="60" width="260" height="80" rx="10" fill="#08427b" stroke="#333"/><text x="830.0" y="86.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Поддержка</text><text x="830.0" y="104.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">[человек]</text><text x="830.0" y="122.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">разбирает жалобы</text><rect x="330" y="230" width="340" height="100" rx="10" fill="#1168bd" stroke="#333"/><text x="500.0" y="257.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Внук на связи</text><text x="500.0" y="275.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">[программная система]</text><text x="500.0" y="293.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">ИИ чинит телефон пожилого,</text><text x="500.0" y="311.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">родственник подключается удалённо</text><rect x="20" y="430" width="225" height="80" rx="10" fill="#8a8a8a" stroke="#333"/><text x="132.5" y="456.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">YandexGPT / GigaChat</text><text x="132.5" y="474.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">[внешняя система]</text><text x="132.5" y="492.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">понимание проблемы, план</text><line x1="500" y1="330" x2="132" y2="430" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="265" y="430" width="225" height="80" rx="10" fill="#8a8a8a" stroke="#333"/><text x="377.5" y="456.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Yandex SpeechKit</text><text x="377.5" y="474.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">[внешняя система]</text><text x="377.5" y="492.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">голос ↔ текст</text><line x1="500" y1="330" x2="377" y2="430" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="510" y="430" width="225" height="80" rx="10" fill="#8a8a8a" stroke="#333"/><text x="622.5" y="456.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">FCM / RuStore Push</text><text x="622.5" y="474.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">[внешняя система]</text><text x="622.5" y="492.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#fff">уведомления родственнику</text><l